<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate the Presenter - Nosedive</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      background-color: #030315; color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    h1 { color: #fff; font-size: 1.5rem; text-shadow: 0 0 10px #00ffff; }
    .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 10px; }
    .star-rating input { display: none; }
    .star-rating label { font-size: 3rem; color: #444; cursor: pointer; transition: color 0.3s; }
    .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label {
      color: #ff007f; text-shadow: 0 0 15px #ff007f;
    }
    #submit-btn {
      margin-top: 30px; padding: 10px 20px; font-size: 1.2rem;
      background-color: transparent; border: 2px solid #ff007f; color: #ff007f; cursor: pointer;
    }
    #submit-btn:hover { background-color: #ff007f; color: #fff; }
    #status { margin-top: 20px; color: #00ffff; display: none; }
  </style>
</head>
<body>
  <h1>給我您的評分</h1>
  <div class="star-rating">
    <input type="radio" name="rating" id="star5" value="5"><label for="star5">★</label>
    <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
    <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
    <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
    <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
  </div>
  <button id="submit-btn">傳送評分 (SUBMIT)</button>
  <p id="status">評分已傳送，謝謝!</p>

  <script>
    // 您的專屬 Firebase 配置代碼
    const firebaseConfig = {
      apiKey: "AIzaSyD4mZm3QCYHg1BdwF4XZ8j9CpMbqtYqEDQ",
      authDomain: "nosedive-rating.firebaseapp.com",
      databaseURL: "https://nosedive-rating-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "nosedive-rating",
      storageBucket: "nosedive-rating.firebasestorage.app",
      messagingSenderId: "834309397899",
      appId: "1:834309397899:web:f963905148059195ad238e",
      measurementId: "G-3FQCWG11TX"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const submitBtn = document.getElementById('submit-btn');
    const statusText = document.getElementById('status');

    submitBtn.addEventListener('click', () => {
      const selectedRating = document.querySelector('input[name="rating"]:checked');
      if (selectedRating) {
        const rating = parseInt(selectedRating.value);
        
        // 將分數傳送到雲端資料庫
        database.ref('votes').push({
          rating: rating,
          timestamp: Date.now()
        });
        
        submitBtn.style.display = 'none';
        document.querySelector('.star-rating').style.opacity = '0.5';
        statusText.style.display = 'block';
      } else {
        alert('請先選擇一個星星分數！');
      }
    });
  </script>
</body>
</html>
