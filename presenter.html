<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosedive Social Rating - LIVE</title>
  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      /* 設定背景圖，讀取你上傳的 bg.png */
      background-image: url('bg.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #FFFFFF;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 將分數區塊絕對定位到畫面的中右側 */
    .rating-overlay {
      position: absolute;
      top: 45%;
      right: 15%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .profile-section {
      display: flex;
      align-items: center;
      margin-bottom: -15px; /* 讓名字跟下方分數靠近一點 */
    }

    .profile-pic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #FFFFFF;
      /* 讀取你上傳的 avatar.png */
      background-image: url('avatar.png');
      background-size: cover;
      background-position: center;
      margin-right: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .presenter-name {
      font-size: 6.5rem;
      font-weight: 100; /* 模擬原劇的極細字體 */
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .score-display {
      display: flex;
      align-items: baseline;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding-left: 15px; /* 稍微往右推，對齊名字 */
    }

    #rating-main {
      font-size: 10rem;
      font-weight: 100;
      margin: 0; 
      line-height: 1;
      transition: transform 0.1s;
    }

    #rating-decimal {
      font-size: 4.5rem;
      font-weight: 100;
      margin-left: 8px;
    }

    /* 將重置按鈕藏在右下角，變半透明以免破壞畫面 */
    #reset-btn {
      position: absolute; 
      bottom: 20px; 
      right: 20px; 
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3); 
      color: rgba(255, 255, 255, 0.3); 
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer; 
      font-size: 0.8rem; 
      font-weight: 300; 
      transition: all 0.3s ease;
    }
    #reset-btn:hover { 
      background-color: rgba(255, 255, 255, 0.9);
      color: #333;
    }
  </style>
</head>
<body>

  <!-- 隱藏在右下角的重置按鈕 -->
  <button id="reset-btn" onclick="resetVotes()">RESET</button>

  <!-- 整個文字與頭像的排版區塊 -->
  <div class="rating-overlay">
    
    <div class="profile-section">
      <div class="profile-pic"></div>
      <h1 class="presenter-name">Lacie</h1>
    </div>

    <div class="score-display">
      <span id="rating-main">0.0</span>
      <span id="rating-decimal">00</span>
    </div>

  </div>

  <script>
    // 你的 Firebase 配置代碼
    const firebaseConfig = {
      apiKey: "AIzaSyD4mZm3QCYHg1BdwF4XZ8j9CpMbqtYqEDQ",
      authDomain: "nosedive-rating.firebaseapp.com",
      databaseURL: "https://nosedive-rating-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "nosedive-rating",
      storageBucket: "nosedive-rating.firebasestorage.app",
      messagingSenderId: "834309397899",
      appId: "1:834309397899:web:f963905148059195ad238e"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ratingMain = document.getElementById('rating-main');
    const ratingDecimal = document.getElementById('rating-decimal');

    // 實時監聽資料庫的變化
    database.ref('votes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        let totalScore = 0;
        let count = 0;
        
        Object.keys(data).forEach(key => {
          totalScore += data[key].rating;
          count++;
        });
        
        // 計算到小數點後三位
        const average = (totalScore / count).toFixed(3);
        
        // 拆分主分數與小字後兩位
        const parts = average.split('.');
        let mainPart = parts[0] + '.' + parts[1].charAt(0);
        let decimalPart = parts[1].substring(1);
        
        ratingMain.innerText = mainPart;
        ratingDecimal.innerText = decimalPart;

        // 數字跳動特效
        ratingMain.style.transform = 'scale(1.05)';
        setTimeout(() => ratingMain.style.transform = 'scale(1)', 150);
      } else {
        ratingMain.innerText = "0.0";
        ratingDecimal.innerText = "00";
      }
    });

    // 清空分數功能
    function resetVotes() {
      if(confirm("Clear all ratings?")) {
        database.ref('votes').remove();
      }
    }
  </script>
</body>
</html>
