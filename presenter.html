<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosedive Social Rating - LIVE</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      background-image: url('bg.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #FFFFFF;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 將分數區塊絕對定位到畫面的中右側 */
    .rating-overlay {
      position: absolute;
      top: 45%;
      right: 15%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .profile-section {
      display: flex;
      align-items: center;
      margin-bottom: -15px;
    }

    .profile-pic {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #FFFFFF;
      background-image: url('avatar.png');
      background-size: cover;
      background-position: center;
      margin-right: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .presenter-name {
      font-size: 6.5rem;
      font-weight: 100; 
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .score-display {
      display: flex;
      align-items: baseline;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding-left: 15px;
    }

    #rating-main {
      font-size: 10rem;
      font-weight: 100;
      margin: 0; 
      line-height: 1;
      transition: transform 0.1s;
    }

    #rating-decimal {
      font-size: 4.5rem;
      font-weight: 100;
      margin-left: 8px;
    }

    /* 頂部低分警告橫條樣式 */
    #warning-message {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 15px 40px;
      background-color: rgba(220, 53, 69, 0.95); /* 警告紅 */
      color: white;
      font-size: 1.8rem;
      font-weight: 400;
      border-radius: 50px;
      letter-spacing: 2px;
      box-shadow: 0 10px 25px rgba(220, 53, 69, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s ease;
      z-index: 999;
    }
    
    /* 當觸發警告時滑出並顯示 */
    .show-warning {
      opacity: 1 !important;
      transform: translateX(-50%) translateY(0) !important;
    }

    #reset-btn {
      position: absolute; 
      bottom: 20px; 
      right: 20px; 
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3); 
      color: rgba(255, 255, 255, 0.3); 
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer; 
      font-size: 0.8rem; 
      font-weight: 300; 
      transition: all 0.3s ease;
    }
    #reset-btn:hover { 
      background-color: rgba(255, 255, 255, 0.9);
      color: #333;
    }
  </style>
</head>
<body>

  <div id="warning-message">
    ⚠️ WARNING: SCORE BELOW 3.0. PENALTY IMMINENT.
  </div>

  <button id="reset-btn" onclick="resetVotes()">RESET</button>

  <div class="rating-overlay">
    <div class="profile-section">
      <div class="profile-pic"></div>
      <h1 class="presenter-name">Lacie</h1>
    </div>

    <div class="score-display">
      <span id="rating-main">0.0</span>
      <span id="rating-decimal">00</span>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4mZm3QCYHg1BdwF4XZ8j9CpMbqtYqEDQ",
      authDomain: "nosedive-rating.firebaseapp.com",
      databaseURL: "https://nosedive-rating-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "nosedive-rating",
      storageBucket: "nosedive-rating.firebasestorage.app",
      messagingSenderId: "834309397899",
      appId: "1:834309397899:web:f963905148059195ad238e"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ratingMain = document.getElementById('rating-main');
    const ratingDecimal = document.getElementById('rating-decimal');
    const warningMessage = document.getElementById('warning-message');

    database.ref('votes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        let totalScore = 0;
        let count = 0;
        
        Object.keys(data).forEach(key => {
          totalScore += data[key].rating;
          count++;
        });
        
        const average = (totalScore / count).toFixed(3);
        const scoreNumber = parseFloat(average);
        
        const parts = average.split('.');
        let mainPart = parts[0] + '.' + parts[1].charAt(0);
        let decimalPart = parts[1].substring(1);
        
        ratingMain.innerText = mainPart;
        ratingDecimal.innerText = decimalPart;

        // 【核心邏輯】檢查分數是否大於 0 且低於 3.00，若是則跳出警告
        if (scoreNumber > 0 && scoreNumber < 3.00) {
          warningMessage.classList.add('show-warning');
        } else {
          warningMessage.classList.remove('show-warning');
        }

        ratingMain.style.transform = 'scale(1.05)';
        setTimeout(() => ratingMain.style.transform = 'scale(1)', 150);
      } else {
        ratingMain.innerText = "0.0";
        ratingDecimal.innerText = "00";
        warningMessage.classList.remove('show-warning');
      }
    });

    function resetVotes() {
      if(confirm("Clear all ratings?")) {
        database.ref('votes').remove();
      }
    }
  </script>
</body>
</html>
