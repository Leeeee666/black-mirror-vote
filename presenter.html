<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosedive Social Rating - LIVE</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      background-color: #AF898E; /* 莫蘭迪粉灰背景 */
      color: #E67389; /* 深粉色文字 */
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; overflow: hidden;
    }
    .rating-container {
      background-color: #F4C7CE; /* 粉彩紙卡背景 */
      padding: 100px 80px;
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
      position: relative;
      width: 60%;
      max-width: 600px;
      height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h2 { 
      font-size: 2rem; 
      font-weight: 300; 
      letter-spacing: 2px; 
      margin-bottom: 50px;
      opacity: 0.8;
    }
    #rating-value {
      font-size: 15rem; /* 超大極簡字體 */
      font-weight: 100; /* 極細字重 */
      margin: 0; 
      color: #E67389;
      line-height: 1;
      transition: transform 0.1s;
    }
    .stars-display {
      font-size: 4rem;
      color: #E67389;
      margin-top: 20px;
      letter-spacing: 5px;
    }
    #total-votes { 
      font-size: 1rem; 
      font-weight: 300;
      margin-top: 50px;
      opacity: 0.7;
    }
    #reset-btn {
      position: absolute; bottom: 20px; right: 20px; background: transparent;
      border: none; color: #E67389; cursor: pointer; font-size: 0.8rem; font-weight: 300; opacity: 0.5;
    }
    #reset-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  
  <div class="rating-container">
    <h2>"You've been rated"</h2>
    <p id="rating-value">0.0</p>
    <div class="stars-display">★★★★★</div>
    <p id="total-votes">Total Ratings: 0</p>
    <button id="reset-btn" onclick="resetVotes()">RESET</button>
  </div>

  <script>
    // 您的專屬 Firebase 配置代碼
    const firebaseConfig = {
      apiKey: "AIzaSyD4mZm3QCYHg1BdwF4XZ8j9CpMbqtYqEDQ",
      authDomain: "nosedive-rating.firebaseapp.com",
      databaseURL: "https://nosedive-rating-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "nosedive-rating",
      storageBucket: "nosedive-rating.firebasestorage.app",
      messagingSenderId: "834309397899",
      appId: "1:834309397899:web:f963905148059195ad238e"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ratingValue = document.getElementById('rating-value');
    const totalVotesText = document.getElementById('total-votes');

    // 實時監聽資料庫的變化
    database.ref('votes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        let totalScore = 0;
        let count = 0;
        
        Object.keys(data).forEach(key => {
          totalScore += data[key].rating;
          count++;
        });
        
        const average = (totalScore / count).toFixed(1);
        
        ratingValue.innerText = average;
        totalVotesText.innerText = `Total Ratings: ${count}`;
        
        // 數字跳動特效
        ratingValue.style.transform = 'scale(1.05)';
        setTimeout(() => ratingValue.style.transform = 'scale(1)', 150);
      } else {
        ratingValue.innerText = "0.0";
        totalVotesText.innerText = "Total Ratings: 0";
      }
    });

    // 清空分數功能
    function resetVotes() {
      if(confirm("Clear all ratings?")) {
        database.ref('votes').remove();
      }
    }
  </script>
</body>
</html>
