<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosedive Social Rating - LIVE</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body {
      background-color: #030315; color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; overflow: hidden;
    }
    .rating-container {
      border: 5px solid #ff007f; box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
      padding: 40px; border-radius: 20px; text-align: center; position: relative;
    }
    #rating-value {
      font-size: 10rem; font-weight: bold; margin: 0; color: #ff007f;
      text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f; transition: transform 0.1s;
    }
    #total-votes { font-size: 2rem; color: #00ffff; margin-top: 10px;}
    h2 { font-size: 2.5rem; text-transform: uppercase; letter-spacing: 5px; }
    #reset-btn {
      position: absolute; bottom: 10px; right: 10px; background: transparent;
      border: 1px solid #444; color: #444; cursor: pointer; font-size: 0.8rem;
    }
    #reset-btn:hover { color: #ff007f; border-color: #ff007f; }
  </style>
</head>
<body>
  <h2>社會信用評分 (Social Rating)</h2>
  <div class="rating-container">
    <p id="rating-value">0.0</p>
    <p id="total-votes">參與人數: 0</p>
    <button id="reset-btn" onclick="resetVotes()">RESET</button>
  </div>

  <script>
    // 您的專屬 Firebase 配置代碼
    const firebaseConfig = {
      apiKey: "AIzaSyD4mZm3QCYHg1BdwF4XZ8j9CpMbqtYqEDQ",
      authDomain: "nosedive-rating.firebaseapp.com",
      databaseURL: "https://nosedive-rating-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "nosedive-rating",
      storageBucket: "nosedive-rating.firebasestorage.app",
      messagingSenderId: "834309397899",
      appId: "1:834309397899:web:f963905148059195ad238e",
      measurementId: "G-3FQCWG11TX"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const ratingValue = document.getElementById('rating-value');
    const totalVotesText = document.getElementById('total-votes');

    // 實時監聽資料庫的變化
    database.ref('votes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        let totalScore = 0;
        let count = 0;
        
        Object.keys(data).forEach(key => {
          totalScore += data[key].rating;
          count++;
        });
        
        const average = (totalScore / count).toFixed(1);
        
        ratingValue.innerText = average;
        totalVotesText.innerText = `參與人數: ${count}`;
        
        // 數字跳動特效
        ratingValue.style.transform = 'scale(1.1)';
        setTimeout(() => ratingValue.style.transform = 'scale(1)', 100);
      } else {
        ratingValue.innerText = "0.0";
        totalVotesText.innerText = "參與人數: 0";
      }
    });

    // 清空分數功能
    function resetVotes() {
      if(confirm("確定要清空目前的評分數據嗎？")) {
        database.ref('votes').remove();
      }
    }
  </script>
</body>
</html>
